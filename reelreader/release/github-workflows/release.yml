# A tag v<version> makes a release: the skill zip for the Claude apps on the
# GitHub release, and the package on npm.
#
# npm by trusted publishing: npm trusts this workflow in this repository (set on
# the package's npm page) and takes a short-lived token from GitHub's OIDC, so no
# long-lived npm token sits in the repository. 0.1.0 went out with a granular
# token (NPM_TOKEN) because npm sets a trusted publisher only on a package that
# exists, and npm revokes such tokens' 2FA bypass in January 2027. While the
# secret is still set, npm uses OIDC first when the trust is configured and the
# token otherwise; once the trust works, the secret is deleted. Trusted
# publishing needs npm 11.5.1 or later, so the step updates npm first.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tag is the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Skill zip (the skill folder with its scripts inside)
        run: |
          mkdir -p stage/reelreader/scripts
          cp -R skills/reelreader/. stage/reelreader/
          cp $(node -p "require('./package.json').files.filter(f => f.startsWith('scripts/')).join(' ')") stage/reelreader/scripts/
          cp LICENSE stage/reelreader/
          (cd stage && zip -qr -X ../reelreader-skill.zip reelreader)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" reelreader-skill.zip --title "reelreader $GITHUB_REF_NAME" --notes-file notes.md
      - name: npm (trusted publishing; the token only until the trust is set)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@^11.5.1
          npm publish --provenance --access public
