# A tag v<version> makes a release: the skill zip for the Claude apps on the
# GitHub release, and the package on npm. npm needs the repository secret
# NPM_TOKEN (a granular token that can publish reelreader); without it the
# release is made and the npm step says it was skipped, so a missing secret is
# never mistaken for a published package.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tag is the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Skill zip (the skill folder with its scripts inside)
        run: |
          mkdir -p stage/reelreader/scripts
          cp -R skills/reelreader/. stage/reelreader/
          cp $(node -p "require('./package.json').files.filter(f => f.startsWith('scripts/')).join(' ')") stage/reelreader/scripts/
          cp LICENSE stage/reelreader/
          (cd stage && zip -qr -X ../reelreader-skill.zip reelreader)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" reelreader-skill.zip --title "reelreader $GITHUB_REF_NAME" --notes-file notes.md
      - name: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::warning::NPM_TOKEN is not set: npm publish skipped"; exit 0; fi
          npm publish --provenance --access public
