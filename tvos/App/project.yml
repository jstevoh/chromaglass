# The Apple TV app's Xcode project, written as an XcodeGen spec so the project file is
# made, not hand-edited and merged (PLAN.md 12-tv-apple). Make it with:
#
#   brew install xcodegen
#   cp Local.xcconfig.example Local.xcconfig   # then fill in the licence Worker's address
#   xcodegen generate                          # writes ChromaGlassTV.xcodeproj, git-ignored
#
# The app links the core (tvos/Package.swift, checked by `npm run tvswift`) and the video
# link (tvos/Video, LiveKit's WebRTC), both as local packages.
name: ChromaGlassTV
options:
  bundleIdPrefix: app.chromaglass
  deploymentTarget:
    tvOS: "16.0"
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  ChromaGlassTV:
    path: ..
  ChromaGlassTVVideo:
    path: ../Video
targets:
  ChromaGlassTV:
    type: application
    platform: tvOS
    # The icon and top shelf are drawn by `npm run brand` (scripts/brand.mjs), not
    # kept by hand in Xcode; the privacy manifest says the app tracks nothing.
    sources: [Sources, Assets.xcassets, PrivacyInfo.xcprivacy]
    dependencies:
      - package: ChromaGlassTV
        product: ChromaGlassTVCore
      - package: ChromaGlassTVVideo
        product: ChromaGlassTVVideo
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ChromaGlass
        # XcodeGen writes literal versions into Info.plist unless told otherwise, so
        # the first archive of build 2 still said 1: point them at the build settings, which
        # the archive's CURRENT_PROJECT_VERSION=<n> overrides.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CGLicenceURL: $(CG_LICENCE_URL)
        UILaunchScreen: {}
        # The app's only encryption is HTTPS through the system and WebRTC's standard
        # DTLS-SRTP to the Mac: no proprietary cipher, so no export papers to upload,
        # and saying so here keeps every TestFlight build from stopping at the
        # compliance question (PLAN 12-tv-apple-7).
        ITSAppUsesNonExemptEncryption: false
        # The Mac's show server is on the house's network, by address, over plain ws://:
        # local networking is allowed without opening the app to arbitrary HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: ChromaGlass connects to the Mac running your show on this network.
        # The app never opens a camera or a microphone: it only receives the Mac's
        # video. But LiveKit's WebRTC framework links AVCaptureDevice and
        # AVCaptureSession (its capture code is compiled in for every platform), and
        # App Store Connect bounced build 1 with ITMS-90683 for the missing camera
        # string. The microphone string is there for the same reason (the framework
        # also links AVAudioSession), so the next upload does not bounce on it. No
        # prompt is ever shown, because no code path asks.
        NSCameraUsageDescription: ChromaGlass does not use the camera. It only shows the video your Mac sends; the video library it uses includes camera code that the app never calls.
        NSMicrophoneUsageDescription: ChromaGlass does not use the microphone. It only plays the show your Mac sends; the video library it uses includes recording code that the app never calls.
    settings:
      base:
        # The App Store record "ChromaGlass TV" is app.chromaglass.tv: the bare
        # app.chromaglass was never registered, and the name ChromaGlass is kept
        # for the iPhone app's own record (PLAN 12-tv-apple-7).
        PRODUCT_BUNDLE_IDENTIFIER: app.chromaglass.tv
        MARKETING_VERSION: "1.0"
        # Every upload needs a build number App Store Connect has not seen: pass
        # CURRENT_PROJECT_VERSION=<n> to the archive (README, "TestFlight").
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: $(CG_TEAM)
        # LiveKit's WebRTC build ships its tvOS simulator slice for Apple silicon only, so a
        # generic simulator build linked x86_64 against nothing and failed on every LKRTC
        # symbol. No Intel Mac runs this app's simulator any more; the device slice is arm64.
        "EXCLUDED_ARCHS[sdk=appletvsimulator*]": x86_64
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
