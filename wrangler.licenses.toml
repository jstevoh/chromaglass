# Cloudflare Worker config for the licence key & store endpoint (PLAN 23.12).
#
# Once:
#   npx wrangler kv namespace create LICENSE_KV          # paste its id below
#   npx wrangler secret put LICENSE_PRIVATE_KEY -c wrangler.licenses.toml
#   npx wrangler secret put WEBHOOK_SECRET -c wrangler.licenses.toml
# Deploy:
#   npm run deploy:licenses
name = "chromaglass-licenses"
main = "server/license-worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "chromaglass"

[[kv_namespaces]]
binding = "LICENSE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
