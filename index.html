<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ChromaGlass</title>
    <meta name="description" content="A liquid light show that moves to your music. Oil, ink and ferrofluid on a simulated glass plate, free to play in your browser." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ChromaGlass: a liquid light show for your music" />
    <meta property="og:description" content="Oil, ink and ferrofluid on a simulated glass plate that moves to your music. Free to play in your browser; Home $35 and Pro $199 for the app, one payment." />
    <meta property="og:image" content="/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      The intro (src/lib/intro.ts): up from the first paint until the plate's
      first frame, over the black the opening's compiles leave. Styled here,
      not in the app's CSS, because it has to paint before any of the app has
      arrived. The remote and a cast are not shows: no intro, decided before
      the first paint so it never flashes there.
    -->
    <script>
      if (/[?&](remote|cast)(=|&|$)/.test(location.search)) document.documentElement.classList.add('cg-no-intro');
    </script>
    <!--
      One address (PLAN.md 23.16). The owner asked, 2026-10-24, for
      chromaglass.web.app "to always immediately forward to chromaglass.art",
      and the same goes for chromaglass.firebaseapp.com, Firebase's other
      default name for the same site.

      Why here and not in firebase.json: Hosting's redirects match a path,
      never a host, and every name of a site serves the same release, so a
      301 there would send chromaglass.art to itself. The other way is a
      second Hosting site for chromaglass.art with a redirect-only release on
      this one, which means moving the custom domain and its certificate in
      the console, an outage while Google issues a new one, and still losing
      what a returning visitor has saved. This script is the first thing in
      the page: it runs before any stylesheet, image or module is asked for,
      so the forward costs the one round trip that fetched this page.

      What a 301 would lose, and this carries: localStorage belongs to the
      origin, so a returning visitor's licence key, settings, presets, set
      lists and MIDI map live on chromaglass.web.app and chromaglass.art
      cannot read them (an iframe of the old name inside the new one gets a
      partitioned, empty store in Chrome, Safari and Firefox alike). The old
      name packs its own chromaglass* keys into the address's fragment, which
      a browser never sends to a server, and the new name writes them back
      before the app's module runs (modules wait for the parse; this does
      not), then takes the fragment out of the address bar.

      What is left behind, on purpose:
        - The signed-in flag and the account's email. Firebase keeps the
          session itself in IndexedDB under the old origin; a flag carried
          without it would open the show as "signed in" with no account
          behind it. The visitor signs in once on chromaglass.art; the
          account gives their licence key back (23.12) if it was not carried.
        - A half-finished emailed-link sign-in (the pending email) and a
          Google redirect in flight. Accepting a pending email from an
          address would let a link sign someone into another person's
          account; the sign-in screen asks for the email again instead.
        - Crash logs, which are this browser's diagnostics, not settings.
        - What is in IndexedDB: the song maps and per-track state, which are
          worked out again from the music.
      The new name only accepts a fragment that came from the old one
      (document.referrer is the old origin after a script redirect; a link
      from anywhere else is ignored), never replaces a key it already has,
      and takes only string values under chromaglass* names.

      What stays on the old name:
        - Firebase's own /__/ paths (the auth handler is authDomain's page).
        - A browser that says it is offline: the old name's service worker
          has the page, and chromaglass.art may not be cached there yet.
        - A page under the old name's service worker checks chromaglass.art
          answers first: navigator.onLine is true on a gig's router with no
          internet, and forwarding there would trade a working cached show
          for a page that cannot load.
        - A ?cast window opened by a show still running on the old name: it
          talks to its opener by postMessage, which needs the same origin.
        - More saved state than an address can hold (over 900,000
          characters; Firefox stops at about a million). It stays, whole,
          rather than arriving in part. `npm run onehost` measures all of it.
    -->
    <script>
      (function () {
        var OLD = ['chromaglass.web.app', 'chromaglass.firebaseapp.com'];
        var HOME = 'https://chromaglass.art';
        var TAG = '#cg-carry=v1.';
        var LEFT = /^chromaglass(-signed-in|-auth-email|-pending-email|-redirect-pending|-recovered|-landing-seen|-crash|:crash)/;
        var MAX = 900000;
        function toB64(s) {
          var b = new TextEncoder().encode(s), bin = '';
          for (var i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
          return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
        function fromB64(s) {
          var bin = atob(s.replace(/-/g, '+').replace(/_/g, '/')), b = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
          return new TextDecoder().decode(b);
        }
        var host = location.hostname;

        if (OLD.indexOf(host) >= 0) {
          if (location.pathname.indexOf('/__/') === 0 || !navigator.onLine) return;
          if (/[?&]cast(=|&|$)/.test(location.search) && window.opener) return;
          var go = function () {
            var saved = {}, any = false;
            try {
              for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && k.indexOf('chromaglass') === 0 && !LEFT.test(k)) { saved[k] = localStorage.getItem(k); any = true; }
              }
            } catch (e) { /* storage refused: nothing to carry */ }
            var hash = location.hash.slice(1), frag = location.hash;
            if (any) {
              frag = TAG + toB64(JSON.stringify(saved)) + (hash ? '&cg-hash=' + encodeURIComponent(hash) : '');
              if (frag.length > MAX) return;
            }
            location.replace(HOME + location.pathname + location.search + frag);
          };
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            var late = false;
            setTimeout(function () { late = true; }, 4000);
            fetch(HOME + '/favicon.svg?reach=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
              .then(function () { if (!late) go(); }, function () { /* unreachable: the cached show plays here */ });
          } else {
            go();
          }
          return;
        }

        if (location.hash.indexOf(TAG) === 0) {
          var rest = location.hash.slice(TAG.length), cut = rest.indexOf('&cg-hash=');
          var payload = cut >= 0 ? rest.slice(0, cut) : rest;
          var was = cut >= 0 ? '#' + decodeURIComponent(rest.slice(cut + 9)) : '';
          try { history.replaceState(history.state, '', location.pathname + location.search + was); } catch (e) { /* the fragment stays in the bar */ }
          var from = '';
          try { from = new URL(document.referrer).hostname; } catch (e) { /* no referrer */ }
          if (OLD.indexOf(from) < 0) return;
          try {
            var got = JSON.parse(fromB64(payload));
            for (var key in got) {
              if (!Object.prototype.hasOwnProperty.call(got, key) || typeof got[key] !== 'string') continue;
              if (key.indexOf('chromaglass') !== 0 || LEFT.test(key) || localStorage.getItem(key) !== null) continue;
              localStorage.setItem(key, got[key]);
            }
          } catch (e) { /* a broken fragment carries nothing; the old name still has it all */ }
        }
      })();
    </script>
    <style>
      html, body { background: #000; }
      .cg-no-intro #cg-intro { display: none; }
      /* Fixed over the window until the plate's frame takes it in, then the
         plate's box exactly. Never a target: the desk under it before the
         plate takes it, and the plate's hands after, get every press. */
      #cg-intro { position: fixed; inset: 0; z-index: 5; overflow: hidden; background: #000; pointer-events: none; container-type: size; transition: opacity 0.9s ease-out; }
      #cg-intro.cg-in-plate { position: absolute; z-index: auto; }
      #cg-intro.cg-out { opacity: 0; }
      /* Held still from the first paint until the opening's render pipelines
         are built (the markup below starts it with .cg-still; gpu/prepare.ts,
         Quiet, lets it go): while Chromium starts the GPU and while those
         compile, a moving picture stopped the page's frames. */
      #cg-intro.cg-still, #cg-intro.cg-still * { animation-play-state: paused !important; }
      /* Only transform and opacity move, so the compositor runs them on its
         own thread: the page's thread is held for seconds while Chromium
         starts the GPU (npm run startup's "held" line), and anything the page
         had to step would stop with it. That is not to say a moving frame is
         free: the compositor presents it through the GPU process, the one
         that is starting the GPU and compiling the opening, and it waits
         there behind them (lib/intro.ts says what was measured, and why it
         starts still). No blend mode on the pools (they were
         mix-blend-mode: screen): over black, screen and plain alpha differ
         only where two pools overlap, and a blended group is a surface of
         its own for the GPU process to build. Taking it out did not end the
         stops (PLAN.md 14v-5); starting still did. */
      .cg-oil { position: absolute; left: 50%; top: 50%; width: 78cqmax; height: 78cqmax; margin: -39cqmax 0 0 -39cqmax; border-radius: 50%; opacity: 0.55; will-change: transform; }
      .cg-oil-a { background: radial-gradient(closest-side, #2a7dff 0%, rgba(20,51,201,0.45) 45%, transparent 100%); animation: cg-orbit 23s linear infinite; }
      .cg-oil-b { background: radial-gradient(closest-side, #15c9b4 0%, rgba(10,111,134,0.45) 45%, transparent 100%); animation: cg-orbit 29s linear infinite reverse; animation-delay: -9s; }
      .cg-oil-c { background: radial-gradient(closest-side, #2fd67e 0%, rgba(11,125,79,0.4) 45%, transparent 100%); animation: cg-orbit 37s linear infinite; animation-delay: -21s; opacity: 0.4; }
      @keyframes cg-orbit {
        0%   { transform: rotate(0deg)   translateX(17cqmin) rotate(0deg)    scale(1); }
        50%  { transform: rotate(180deg) translateX(17cqmin) rotate(-180deg) scale(1.18); }
        100% { transform: rotate(360deg) translateX(17cqmin) rotate(-360deg) scale(1); }
      }
      .cg-mark { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: max(10px, 3cqmin); }
      .cg-dish { position: relative; width: max(72px, 26cqmin); height: max(72px, 26cqmin); }
      .cg-burst { position: absolute; inset: 0; width: 100%; height: 100%; animation: cg-turn 48s linear infinite; will-change: transform; }
      /* The hub is the burst's middle 208 of its 560: drawn to that share of the dish. */
      .cg-hub { position: absolute; left: 31.43%; top: 31.43%; width: 37.14%; height: 37.14%; }
      .cg-name { height: max(22px, 7cqmin); width: auto; }
      .cg-sub { font: 400 max(10px, 1.9cqmin)/1 "Geist Mono", ui-monospace, Menlo, monospace; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.5); animation: cg-breathe 2.8s ease-in-out infinite; }
      @keyframes cg-turn { to { transform: rotate(360deg); } }
      @keyframes cg-breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #cg-intro *, #cg-intro { animation: none !important; transition: none !important; } }
    </style>
    <!--
      A show screen (?cast=: the projector window, a cast receiver) never shows
      the pointer, from its first paint: set here rather than in main.tsx,
      whose stylesheet and script arrive later, and in the waiting black
      before them the arrow was on the wall for the first tens of
      milliseconds. CastDisplay.tsx says why; `npm run showcursor` holds it.
    -->
    <style>html.show-screen, html.show-screen * { cursor: none !important; }</style>
    <script>if (/[?&]cast(=|&|$)/.test(location.search)) document.documentElement.classList.add('show-screen');</script>
  </head>
  <body>
    <div id="root"></div>
    <div id="cg-intro" class="cg-still" aria-hidden="true">
      <div class="cg-oil cg-oil-a"></div>
      <div class="cg-oil cg-oil-b"></div>
      <div class="cg-oil cg-oil-c"></div>
      <div class="cg-mark">
        <div class="cg-dish"><img class="cg-burst" src="/intro-burst.svg" alt="" /><img class="cg-hub" src="/intro-hub.svg" alt="" /></div>
        <img class="cg-name" src="/intro-name.svg" alt="ChromaGlass" />
        <div class="cg-sub">Warming the lamp</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
