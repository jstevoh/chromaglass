name: Deploy to Firebase Hosting

# Every push to main is checked, built and published to the live channel. Run
# it by hand from the Actions tab with "Run workflow" when you want to redeploy
# without a code change.
#
# "Checked" means `checks.yml`: the numeric harnesses, the projector's
# geometry, the flash guard, and a browser walked through a show night. Nothing
# is published until they are green.
#
# FIREBASE_SERVICE_ACCOUNT is set, and deploys are live. These are the steps
# that created it, kept for rotating the key or standing the project up again:
#
#   1. Firebase console → Project settings → Service accounts → Generate new
#      private key. (Or: gcloud iam service-accounts keys create key.json
#      --iam-account=<sa>@chromaglass.iam.gserviceaccount.com)
#   2. The account needs the "Firebase Hosting Admin" and "API Keys Viewer"
#      roles on the chromaglass project.
#   3. GitHub → Settings → Secrets and variables → Actions → New repository
#      secret, named FIREBASE_SERVICE_ACCOUNT, with the whole JSON file as its
#      value.
#
# Optional: set VITE_FINGERPRINT_PROXY_URL as a second secret to enable
# automatic song identification. Left unset, the build still succeeds and the
# Track panel falls back to manual tagging.
#
# Optional: set VITE_CRASH_REPORT_URL (https://<the report Worker>/report) to
# give the crash report sheet its Send button. Left unset, the build still
# succeeds and the sheet offers Save and Copy only. The Worker's setup is in
# docs/crash-plan.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other onto the live channel.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  # Was this exact tree already measured? A squash merge of a PR whose head
  # already contained main publishes, file for file, the tree its PR's
  # `Checks` run passed on. Running the four macOS shards over it again cannot
  # find a bug the first run missed, only a flaky check, and on 2026-09-27 that
  # is what 3 of the 5 red deploys were (#189, #195, #196), each one holding
  # every merge behind it and doubling the Mac queue. The reasoning, and the
  # four conditions, are in `scripts/deploygate.sh`; `npm run deploygate --
  # --history 20` replays it over recent merges (16 of 20 would have skipped).
  # A run started by hand always checks: that is what someone reaching for the
  # button usually wants.
  verified:
    name: Already checked on its PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tested: ${{ steps.gate.outputs.tested }}
    steps:
      - uses: actions/checkout@v5
      # A gate that cannot answer (the API down, a rate limit) must not stop a
      # deploy or wave one through: it leaves `tested` unset and the checks run.
      - id: gate
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # main as it stood before this push, for the gate's fallback rule.
          BEFORE: ${{ github.event.before }}
        run: bash scripts/deploygate.sh "$GITHUB_SHA" "$BEFORE"

  # Nothing reaches the live site until the app has been measured and driven.
  # `npm run show` pulls main on show night, so what is on main is what turns
  # up at the venue; a deploy gated only on the typechecker was a deploy gated
  # on nothing that an audience can see. That still holds: either this run
  # measures it, or `verified` found the PR run that measured this same tree.
  checks:
    name: Checks
    needs: verified
    if: ${{ needs.verified.outputs.tested != 'true' }}
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Build and deploy
    needs: [verified, checks]
    # `checks` is skipped only when `verified` said the tree had passed; a
    # skipped `checks` for any other reason (a failed `verified`) never deploys.
    if: >-
      ${{ !cancelled() && needs.verified.result == 'success' &&
          (needs.checks.result == 'success' ||
           (needs.checks.result == 'skipped' && needs.verified.outputs.tested == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FINGERPRINT_PROXY_URL: ${{ secrets.VITE_FINGERPRINT_PROXY_URL }}
          VITE_CRASH_REPORT_URL: ${{ secrets.VITE_CRASH_REPORT_URL }}

      # The secret exists now, so a run that builds but cannot publish means it
      # was removed or renamed. That is worth a red X: it used to be pending
      # setup, and green-but-not-deployed is the one state nobody would notice.
      - name: Check for deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error title=Not deployed::FIREBASE_SERVICE_ACCOUNT is not set, so the build cannot be published. See the setup notes at the top of .github/workflows/deploy.yml."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: chromaglass
          channelId: live
