name: Deploy to Firebase Hosting

# Every push to main is checked, built and published to the live channel. Run
# it by hand from the Actions tab with "Run workflow" when you want to redeploy
# without a code change.
#
# "Checked" means `checks.yml`: the numeric harnesses, the projector's
# geometry, the flash guard, and a browser walked through a show night. Nothing
# is published until they are green.
#
# FIREBASE_SERVICE_ACCOUNT is set, and deploys are live. These are the steps
# that created it, kept for rotating the key or standing the project up again:
#
#   1. Firebase console → Project settings → Service accounts → Generate new
#      private key. (Or: gcloud iam service-accounts keys create key.json
#      --iam-account=<sa>@chromaglass.iam.gserviceaccount.com)
#   2. The account needs the "Firebase Hosting Admin" and "API Keys Viewer"
#      roles on the chromaglass project.
#   3. GitHub → Settings → Environments → firebase-live → Add environment
#      secret, named FIREBASE_SERVICE_ACCOUNT, with the whole JSON file as its
#      value. An environment secret, not a repository one (the security audit
#      of 2026-10-28): the key can publish anything to the live site, and a
#      repository secret is readable by any workflow a pull request's branch
#      writes for itself. `firebase-live` lets only main deploy (its
#      deployment branches: main), so neither a branch's run nor a Run
#      workflow started on a branch can reach it. No required reviewers: a
#      merge deploys without anyone waiting (the owner, 2026-09-27).
#
# Optional: set VITE_FINGERPRINT_PROXY_URL as a second secret to enable
# automatic song identification. Left unset, the build still succeeds and the
# Track panel falls back to manual tagging.
#
# Optional: set VITE_CRASH_REPORT_URL (https://<the report Worker>/report) to
# give the crash report sheet its Send button. Left unset, the build still
# succeeds and the sheet offers Save and Copy only. The Worker's setup is in
# docs/crash-plan.md.
#
# Optional: set VITE_FIREBASE_LICENSES_URL (the licence Worker's address with no
# path, https://<the licence Worker>) so a signed-in site asks the Worker for the
# account's keys (`/keys`) and files its marketing choice (`/preferences`). The
# build folds those calls away when it is unset (Vite replaces the missing
# variable with undefined and drops the branch), so the site signs in but never
# fetches the account's key. Typing a key by hand works either way: it is checked
# offline.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosted:
        description: "Every Mac shard on GitHub's Macs, none on the owner's (what the watchdog's re-run asks for)"
        type: boolean
        default: false

# Never let two deploys race each other onto the live channel.
# Read-only unless a job says otherwise; what the deploy gate and the checks
# read is runs (actions) and the pull request (pull-requests). Written out, not
# left to the repository's default, which a settings change could widen.
permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  # Was this exact tree already measured? A squash merge of a PR whose head
  # already contained main publishes, file for file, the tree its PR's
  # `Checks` run passed on. Running the four macOS shards over it again cannot
  # find a bug the first run missed, only a flaky check, and on 2026-09-27 that
  # is what 3 of the 5 red deploys were (#189, #195, #196), each one holding
  # every merge behind it and doubling the Mac queue. The reasoning, and the
  # four conditions, are in `scripts/deploygate.sh`; `npm run deploygate --
  # --history 20` replays it over recent merges (16 of 20 would have skipped).
  # A run started by hand always checks: that is what someone reaching for the
  # button usually wants.
  #
  # Since PLAN.md 19j a fourth answer comes first: `nothing`, when no file the
  # site is built from differs from the commit that is live (a docs-only or
  # check-only merge). Then nothing is checked or published, and the run is
  # green in seconds. Over the 30 merges to 2026-10-04 three would have
  # answered it, and one of them (#245, docs only) waited 79 minutes for the
  # Mac. A run by hand still checks and deploys, and is how a changed build
  # secret (VITE_*, above) goes live: a docs merge no longer carries one out.
  verified:
    name: Already checked on its PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tested: ${{ steps.gate.outputs.tested }}
    steps:
      - uses: actions/checkout@v5
      # A gate that cannot answer (the API down, a rate limit) must not stop a
      # deploy or wave one through: it leaves `tested` unset and the checks run.
      - id: gate
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # main as it stood before this push, for the gate's fallback rule.
          BEFORE: ${{ github.event.before }}
        run: bash scripts/deploygate.sh "$GITHUB_SHA" "$BEFORE"

  # Nothing reaches the live site until the app has been measured and driven.
  # `npm run show` pulls main on show night, so what is on main is what turns
  # up at the venue; a deploy gated only on the typechecker was a deploy gated
  # on nothing that an audience can see. That still holds: either this run
  # measures it, or `verified` found the PR run that measured this same tree.
  #
  # Since 2026-10-04 (the owner's choice, PLAN.md 19h-3) a third answer:
  # `disjoint`, when the PR's run passed the Mac on an older main and the site
  # files it changed are not ones main changed since. Then Measure runs on the
  # exact tree and the Mac shards do not; the reasons are in deploygate.sh.
  #
  # Since PLAN.md 19ah the Mac shards can run on the owner's own Mac (a
  # self-hosted runner labelled `owner-mac`) instead of GitHub's, when `mac`
  # below finds it online and idle. On the 13 deploys of the fortnight to
  # 2026-10-28 that ran the Mac shards, a shard waited a mean 50 minutes for a
  # GitHub Mac (the slowest of the five, 80), for about 17 minutes of work, and
  # such a deploy took 124 minutes from push to live. `checks` waits for the
  # answer but never for the Mac: a probe that fails, finds no token, or finds
  # the Mac asleep or busy names no shards, and every shard runs on GitHub's.
  mac:
    name: Is the owner's Mac free
    needs: verified
    if: ${{ !inputs.hosted && needs.verified.outputs.tested != 'true' && needs.verified.outputs.tested != 'nothing' && needs.verified.outputs.tested != 'disjoint' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Where MAC_RUNNER_PROBE lives: the `mac-runner` environment, which main
    # and, since 19ah-6, a pull request's merge ref (`refs/pull/*/merge`, for
    # the pull request's own probe in checks.yml) may use; a fork's run gets
    # no secrets and never starts that probe. The token reads the repository's
    # runners (fine-grained, this repository only, Administration: read) and
    # nothing else; it cannot register a runner. The keys that publish and
    # sign stay in environments only main can use (scripts/cisecrets.mjs).
    environment: mac-runner
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.probe.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
      - id: probe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MAC_RUNNER_PROBE }}
          MAC_SHARDS: ${{ vars.OWNER_MAC_SHARDS }}
        run: node scripts/macrunner.mjs

  # The probe's answer can go stale: the Mac can sleep in the minute between
  # "free" and the jobs, and a self-hosted job then queues for up to a day,
  # holding every deploy behind it (PLAN.md 19ah-3). Beside the checks, this
  # reads the run's jobs; a shard queued for the owner's Mac with none running
  # for 15 minutes starts this workflow again with `hosted` (every shard on
  # GitHub's Macs) and cancels this run. It never fails the deploy: it is not a
  # need of `deploy`, and its step carries on past an error.
  watchdog:
    name: Watchdog
    needs: mac
    if: ${{ needs.mac.outputs.shards != '' && needs.mac.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    # Five shards of about 17 minutes in series, with room; it stops as soon
    # as every one of them has started.
    timeout-minutes: 150
    permissions:
      contents: read
      # To start deploy.yml again (a workflow_dispatch, which GITHUB_TOKEN may
      # start) and to cancel this run. Nothing else.
      actions: write
    steps:
      - uses: actions/checkout@v5
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHARDS: ${{ needs.mac.outputs.shards }}
        run: node scripts/macwatch.mjs

  checks:
    name: Checks
    needs: [verified, mac]
    # Written out with `!cancelled()` because `mac` is skipped whenever the
    # Mac shards will not run, and a job whose need was skipped is skipped
    # with it unless its condition says otherwise. `verified` must still have
    # succeeded, as the implicit condition required before.
    if: >-
      ${{ !cancelled() && needs.verified.result == 'success' &&
          needs.verified.outputs.tested != 'true' && needs.verified.outputs.tested != 'nothing' }}
    uses: ./.github/workflows/checks.yml
    # A called workflow's jobs may ask for no more than its caller allows, and
    # GitHub checks that when the run starts, for a job that will be skipped
    # too: checks.yml's pull-request watchdog (19ah-6) asks for `actions:
    # write` to cancel its own run. It never runs here (it needs the PR's own
    # `mac` probe), and every other job in checks.yml names its own
    # permissions or takes the file's read-only ones, so this lifts nothing
    # they hold.
    permissions:
      contents: read
      actions: write
      pull-requests: read
    with:
      mac: ${{ needs.verified.outputs.tested != 'disjoint' }}
      local: ${{ needs.mac.outputs.shards || '[]' }}

  deploy:
    name: Build and deploy
    needs: [verified, checks]
    # `checks` is skipped only when `verified` said the tree had passed; a
    # skipped `checks` for any other reason (a failed `verified`) never deploys.
    # `nothing` publishes nothing: the live site is already this build's.
    if: >-
      ${{ !cancelled() && needs.verified.result == 'success' &&
          needs.verified.outputs.tested != 'nothing' &&
          (needs.checks.result == 'success' ||
           (needs.checks.result == 'skipped' && needs.verified.outputs.tested == 'true')) }}
    runs-on: ubuntu-latest
    # Where FIREBASE_SERVICE_ACCOUNT lives (step 3 at the top): main only.
    environment: firebase-live
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FINGERPRINT_PROXY_URL: ${{ secrets.VITE_FINGERPRINT_PROXY_URL }}
          VITE_CRASH_REPORT_URL: ${{ secrets.VITE_CRASH_REPORT_URL }}
          VITE_FIREBASE_HOSTED_SITE: '1'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_LICENSES_URL: ${{ secrets.VITE_FIREBASE_LICENSES_URL }}

      # The secret exists now, so a run that builds but cannot publish means it
      # was removed or renamed. That is worth a red X: it used to be pending
      # setup, and green-but-not-deployed is the one state nobody would notice.
      - name: Check for deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error title=Not deployed::FIREBASE_SERVICE_ACCOUNT is not set, so the build cannot be published. See the setup notes at the top of .github/workflows/deploy.yml."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        # Pinned to a commit (v0.11.0, the commit v0 named on 2026-10-28), not
        # the moving v0 tag: this step holds the key that publishes the site,
        # and a tag can be moved to other code by whoever controls that repo.
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: chromaglass
          channelId: live
