name: Deploy to Firebase Hosting

# Every push to main is typechecked, built and published to the live channel.
# Run it by hand from the Actions tab with "Run workflow" when you want to
# redeploy without a code change.
#
# FIREBASE_SERVICE_ACCOUNT is set, and deploys are live. These are the steps
# that created it, kept for rotating the key or standing the project up again:
#
#   1. Firebase console → Project settings → Service accounts → Generate new
#      private key. (Or: gcloud iam service-accounts keys create key.json
#      --iam-account=<sa>@chromaglass.iam.gserviceaccount.com)
#   2. The account needs the "Firebase Hosting Admin" and "API Keys Viewer"
#      roles on the chromaglass project.
#   3. GitHub → Settings → Secrets and variables → Actions → New repository
#      secret, named FIREBASE_SERVICE_ACCOUNT, with the whole JSON file as its
#      value.
#
# Optional: set VITE_FINGERPRINT_PROXY_URL as a second secret to enable
# automatic song identification. Left unset, the build still succeeds and the
# Track panel falls back to manual tagging.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other onto the live channel.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_FINGERPRINT_PROXY_URL: ${{ secrets.VITE_FINGERPRINT_PROXY_URL }}

      # The secret exists now, so a run that builds but cannot publish means it
      # was removed or renamed. That is worth a red X: it used to be pending
      # setup, and green-but-not-deployed is the one state nobody would notice.
      - name: Check for deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error title=Not deployed::FIREBASE_SERVICE_ACCOUNT is not set, so the build cannot be published. See the setup notes at the top of .github/workflows/deploy.yml."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: chromaglass
          channelId: live
