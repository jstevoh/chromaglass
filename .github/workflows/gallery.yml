name: Preset gallery

# Every preset, photographed on a GPU that presents (docs/presets-plan.md).
# The presets are judged by eye; this is the eye's evidence. It never stands
# in the deploy's way. The pictures come back as the `preset-gallery`
# artifact: one JPEG per preset per moment, and gallery/contact.jpg with all
# of them on one sheet.
#
# On request only: Actions → Preset gallery → Run workflow, or on a pull
# request by labelling it `gallery` (once per labelling, not per push: remove
# the label and add it again to photograph a later push). A cloud session can
# label a PR but gets a 403 on `workflow_dispatch`, so the label is how a
# session asks for pictures.
#
# It used to run by itself on every pull-request push whose PR touched the
# presets, the fade, the plate shader or the solver. A PR's paths are its
# whole diff, not the push's, and `plate.ts` and `fluid.ts` are the most
# edited files in the repository, so nearly every push of nearly every PR
# matched, and a run that had started was never cancelled. Measured over the
# fifteen hours to 2026-10-03 19:14 UTC through the Actions API: 30 gallery
# runs at 29 runner-minutes each, 870 of the 2,850 minutes that every macOS
# job together held a runner, 31% of the Mac time, while `Checks`' four Mac
# shards per push waited 17 minutes on average for a runner and, at 19:14,
# 37 Mac jobs sat queued or running at once. Mac runners are capped per
# account (the busiest hours never held more than five to eight at once), so
# every gallery run was a Checks shard not running. PLAN.md 19a.
#
# Labelled `lamp-gallery` instead, it photographs every preset at 12 and 30
# seconds, each moment twice, on black and on the lamp (Lamp Ground 0 and 1),
# for `npm run lampjudge`, which picks each look's ground (PLAN 18b-1).
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated preset ids (blank for all)'
        required: false
        default: ''
      times:
        description: 'Seconds after load to photograph'
        required: false
        default: '8,20,40'
      grounds:
        description: 'Lamp Ground values to photograph each moment at, e.g. 0,1 (blank: as each look ships)'
        required: false
        default: ''
  pull_request:
    types: [labeled]

# The label is in the group so that labelling a PR `controls` (whose run of
# this workflow skips its one job) never cancels a gallery that is
# photographing; a second `gallery` labelling replaces the first's run. A run
# by hand has no label and gets a group of its own, so a second one (other
# presets, other moments) never cancels the first.
concurrency:
  group: gallery-${{ github.ref }}-${{ github.event.label.name || github.run_id }}
  cancel-in-progress: true

# Read-only, written out rather than left to the repository's default, which a
# settings change could widen (the security audit of 2026-10-28).
permissions:
  contents: read

jobs:
  gallery:
    name: Gallery (macOS)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'gallery' || github.event.label.name == 'lamp-gallery'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Photograph every preset
        run: npm run gallery
        env:
          GALLERY_ONLY: ${{ inputs.only }}
          GALLERY_TIMES: ${{ inputs.times || (github.event.label.name == 'lamp-gallery' && '12,30') || '' }}
          GALLERY_GROUNDS: ${{ inputs.grounds || (github.event.label.name == 'lamp-gallery' && '0,1') || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preset-gallery
          path: gallery/
          retention-days: 14

  # What a hand pour does on the looks the grey-wash fix reaches, and which
  # looks those are (PLAN 28d-A, #401): the plate mean 1, 3 and 10 s after a
  # pour with the bank off and on, and the black share over time. A job of its
  # own so the photographs above keep the time they were given, and a
  # `lamp-gallery` run, which asks for other pictures, does not pay for it.
  # It is one more Mac job, and a long one, for every `gallery` labelling: it
  # opens every distinct preset for six seconds, pours five times on each of
  # four sparse looks, then runs two long series. Budget the Mac queue for it
  # (`npm run macqueue`) before labelling a PR with other Mac work going.
  handpour:
    name: Hand pour (macOS)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'gallery'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Hand pours and black share on the looks the fix reaches
        run: npm run handpour
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handpour
          path: handpour.json
          retention-days: 14
