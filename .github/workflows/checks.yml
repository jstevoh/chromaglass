name: Checks

# What has to be true before a build is allowed to reach the live site.
#
# This used to be `tsc --noEmit` and `vite build`, which between them prove
# that the code is well-typed and that the bundler is happy — and nothing at
# all about whether the app works. The six numeric harnesses and the browser
# walkthrough existed the whole time and were never run by anything except a
# person remembering to. Since `npm run show` pulls `main` on show night, what
# that added up to was: an untested `main` is what arrives at the venue.
#
# Three jobs, because they cost very different amounts of time and a fast red X
# is worth more than a slow one:
#
#   measure   the pure-logic harnesses. Half a minute, no browser.
#   webgpu    everything with a picture in it, on a runner with a GPU: the
#             stage, a show night, the post chain and the wall.
#
# There is one engine since P7, and a runner without a GPU can compute WebGPU
# but cannot present its canvas (the P0 spike) — so every check that needs a
# picture runs on macOS, and ubuntu keeps the ones that need only arithmetic.

# The run's title carries the commit it tested, which for a pull request is
# GitHub's merge of the head into its base, not the head. The deploy reads it
# back (`scripts/deploygate.sh`) to ask whether main's new tree is the tree
# this run passed on, directly, rather than inferring it from the head. Ignored
# when `deploy.yml` calls this workflow, which keeps its own title.
run-name: "${{ github.event.pull_request.title || 'Checks' }} (tests ${{ github.sha }})"

on:
  workflow_call:
  pull_request:

# A second push to a branch makes the first push's run pointless, and these are
# expensive: three runners, one of them for most of an hour. Superseded pull
# request runs are cancelled. Deploys are not — `deploy.yml` has its own
# `cancel-in-progress: false` on the live channel, and a `workflow_call` run
# inherits the caller's group rather than this one.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # 22, not 20: `music`, `scene`, `liquids` and `wall` all run their
      # TypeScript sources directly through `node --experimental-strip-types`,
      # which arrived in 22.6. On 20 every one of them fails to start, which
      # with `deploy.yml`'s `needs: checks` would have blocked every deploy.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run lint

      # Every preset's dish: that its dyes, injection styles and liquids all
      # name things that exist. The cheapest check in the repo and the one that
      # catches a rename that a type cannot.
      - name: The plate
        run: npm run plate

      # That a look change never cuts the plate to black in front of a room.
      - name: The desk
        run: npm run desk

      # The two lists that have to agree about what a control is: the settings
      # panel's own markup, and the registry the desks pin from.
      - name: The panel
        run: npm run panel

      # The ear: level traces through the real calibration into the boundary
      # detector, synthetic songs through the real matcher, and the tempo
      # sources through the real beat clock.
      - name: The ear
        run: npm run music

      # The bands: synthetic kicks, snares, hats, a bass line and a pad through
      # the analyser the show and a song render both use, alone and mixed, loud
      # and 20 dB down, at 60 and 30 fps. Each drum found on its own hits within
      # a frame, nothing firing on another's, and two runs of the same song
      # byte-identical. Then the shelf's real MP3s, decoded with ffmpeg, which
      # the ubuntu runner does not have until it is installed here; with no
      # decoder the script fails on CI rather than skipping the real music.
      - name: ffmpeg, for the shelf and the render's files
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: The bands
        run: npm run bands

      # Sound learn: controls bound to the music. A synthesised song through
      # the analyser, the beat clock and the trigger engine frame by frame: a
      # kick trigger fires once per kick and never on a hat, ahead of the heard
      # onset once the clock is locked; a mapping moves its setting by its depth
      # and two add and clamp; the map file round-trips; and with the music
      # stopped nothing fires.
      - name: Sound learn
        run: npm run learn

      # The song's shape (PLAN.md §10, step 2): builds, drops and breakdowns
      # heard live. Synthesised songs whose sections are known to the sample
      # (four on the floor at 90 to 140 bpm, 20 dB down, a build that keeps
      # its kick, a rock song with fills): every drop within a bar and none
      # anywhere else, builds before their drops, breakdowns within four bars,
      # nothing at all in two minutes of groove, the same at 30 fps, triggers
      # bound to each fire once per event; then the shelf, decoded by the
      # ffmpeg installed above, held to at most a drop a minute.
      - name: The song's shape
        run: npm run shape

      # The kicks (PLAN.md §14d): the show's own band, its score rendered to
      # samples at 48 and 44.1 kHz and heard through the live ear, with the
      # plate at 60, 30 and 20 fps and frames late, and the ear reading at
      # 60 Hz under a slower plate: every section's kicks heard by the clock
      # and by the ear itself, the song's shape counting them, the lock
      # within the first bars; and the old ear, the smoothed bass crossing
      # its line, missing the chorus as the Mac did.
      - name: The kicks
        run: npm run kicks

      # The one (PLAN.md §10, step 3): the beats and which of them is the one,
      # on eight synthesised songs whose bars are known (four on the floor
      # and a rock beat, a chord a bar or every two), 20 dB down, at 30 fps,
      # and after a gap into a new tempo: a real beat named within 70 ms at
      # the song's tempo, no kick but the one ever called the one, every kick
      # weighed exactly what its place says; a pulse and three loops with no
      # bar never placed, on a beat they do hear; fuzzed onset streams never
      # naming a tempo outside the range nor hanging (a child process with a
      # deadline); an estimate's median and 99th percentile cost; and the
      # accent at 0 leaving every kick at exactly 1. About a minute and a half.
      - name: The one
        run: npm run downbeat

      # Pacing (PLAN.md §10, step 1): a running sequence's stages played as
      # scenes. At Pacing 0 every built-in sequence hands the plate exactly 1
      # and 1 and fires nothing; "Light Show Night", measured with the
      # footage's own yardstick, swells 1.5 to 3.5 a minute and is calm 20 to
      # 40 % of the time; dark endings reach near-black without a step; and a
      # locate neither piles moments up nor loses them.
      - name: Pacing
        run: npm run pacing

      # A song render's arithmetic (PLAN.md §6): the show clock is the frame
      # number while rendering and the browser's own clock live; the song's
      # track is the same bytes twice and hears the kicks at the same moments
      # at 30 and 60 fps; the ear the render uses is the live hook's to the
      # last bit; and both file writers give back every sample, at its time,
      # through a strict reader, the same bytes twice; and ffprobe, installed
      # above for the shelf, opens each file with the right streams, every
      # packet and the right length (with no ffprobe this fails on CI).
      - name: The render's clock, ear and file
        run: npm run render

      # The shape of the quality ladder: that every rung is a rung, that a
      # step down gives something up, and that a rung asking for fewer device
      # pixels actually gets fewer. That last one was inert for a long while
      # and nothing looked.
      - name: The ladder's shape
        run: npm run rungs

      # Soap, milk, silicone and glycerine, each measured on the thing it is
      # for — and first, that an empty plate is left completely alone.
      - name: The liquids
        run: npm run liquids

      # A liquid someone made: the file reads back as what they meant, a bad
      # one says why, and "how it meets the others" agrees with the shelf.
      - name: The liquids file
        run: npm run liquidfile
      # A popped bubble closes back into the liquid, round, not into blocks.
      - name: The popped bubbles
        run: npm run pops
      # Drops, not rings (PLAN.md batch 3): on a plate a current has crowded,
      # each drop its own colour, pressed flat where it touches, a swallowed
      # one kept inside and let go, and at 0 the rings' field to the bit.
      - name: The drops
        run: npm run drops
      # A soap film's own colours (Film Physics): the research's film.py to a level of
      # 8-bit colour, the textbook sequence in the shader's table, and the shader carrying it.
      - name: The film table
        run: npm run filmtable
      # A Mixer row taken out over bars and brought back (PLAN.md §11 step 4):
      # whole fades driven at the show timer's 16 ms, no step past the curve's
      # steepest, the turn-round, the hand, the cut, and the pads wired.
      - name: A row's fade
        run: npm run rowfade
      # The set list file: a show's running order reads back as it was written.
      - name: The set list file
        run: npm run setlist
      # The same seed plays the same show (PLAN.md §6, lib/rng.ts): nothing in
      # src draws from Math.random outside a short allowlist of ids, and the
      # beads, bubbles, closeup camera, chemistry, palette and automation run
      # twice on one seed come out the same, on another seed differently, and
      # none of them moves another's numbers.
      - name: The seed
        run: npm run seed

      # The room sensor: painted rooms through the real analysis, a closed
      # feedback loop, and a person who walks in and stops.
      - name: The room
        run: npm run scene

      # Four harnesses that were written as gates and then never gated
      # anything, because nothing here ran them. All four cover arithmetic
      # with no picture in it, which is the kind most able to be quietly
      # wrong: a triangle that is really a sawtooth, a timecode reader two
      # frames behind all night, a fixture lit on the wrong channel, a shape
      # mapped onto the wrong part of a wall.
      - name: The shapes
        run: npm run shapes

      - name: The timecode
        run: npm run timecode

      # The closeup's drawn cells ride the paint and hold still between
      # frames (lib/detailFlow.ts): frame by frame they move as far as the
      # dye did, through frame-time noise, dropped frames, 20 to 144 Hz, the
      # tempo and the lean changing and Speed pulled to nothing; their clock
      # wraps cleanly; and packing the flow adds no rounding of its own.
      - name: The closeup's cells
        run: npm run cellride

      - name: The lights
        run: npm run lights

      - name: The mapping
        run: npm run map

      # The crash-report Worker, against in-memory R2 and KV (crash-plan.md):
      # a report is stored with its picture beside it and indexed by the line
      # it died on; the wrong kind, bad JSON and an oversized body are refused
      # without quoting them; the digest folds lines that differ only in their
      # numbers into one group and is closed without the token; and one
      # address is held to its hourly limit. The endpoint is public, so most
      # of what it proves is what it will not do.
      - name: The report Worker
        run: npm run report-worker

      # The layout, which is CSS and needs no GPU (scripts/layout.mjs): every
      # control fits, reads, and is not painted over, at every width, and the
      # mode switch stays put. The same measurements run again inside the show
      # night on macOS; here they fail in two minutes rather than fifteen, and
      # before the GPU shards have a chance to hide them behind another step.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: The layout
        run: npm run layout

      # The phone (scripts/phone.mjs): on an emulated phone, in portrait and
      # landscape, every tool and sheet in reach at 48 px, the plate keeping
      # most of the screen, each sheet opening and closing, and Tilt's
      # arithmetic. The fingers on the plate need WebGPU and are asked on the
      # tools shard below.
      - name: The phone
        run: npm run phone
      # The iPhone app as the laptop's remote (src/lib/appLink.ts): a real
      # relay, a stand-in laptop and the app's page from another origin. No
      # plate needed, so it runs here rather than on a Mac.
      - name: The iPhone app's remote
        run: npm run applink

      # The remote's Mixer (scripts/remotemix.mjs): the show server and two
      # browsers, a display and a phone on ?remote=1, every question asked of
      # the display's settings. No GPU: the display's socket, settings and
      # fades run on its "needs WebGPU" screen. The phone's step above built
      # dist/, which the show server serves, so this runs the script alone.
      - name: The remote's Mixer
        run: node --experimental-strip-types scripts/remotemix.mjs
      # The sound re-renders nothing it need not (scripts/renders.mjs, PLAN.md
      # §14f): with the band playing the App renders at most five times a
      # second more than the ear tells it (ten), and the plate still hears a
      # new reading nearly every frame; on a quiet page, at most one and a
      # half. On a laptop page and a phone.
      # The counts need no GPU; the plate's own line (a new reading nearly
      # every frame) needs a plate that draws and is held on the Mac's open
      # shard below. On the dist/ the phone's step built, like the Mixer.
      - name: The sound's renders
        run: node scripts/renders.mjs

  # The WebGPU stage (docs/webgpu-plan.md), on macOS: GitHub's Apple Silicon
  # runners give Chromium a Metal GPU, where a Linux runner's software WebGPU
  # cannot present a canvas (measured in the P0 spike, spike/webgpu-p0).
  #
  # Three runners side by side rather than one after another. On one runner
  # the job took sixteen minutes, every check waiting on the one before it,
  # and the first failure skipped everything after it, so a push with three
  # things wrong took three rounds to find them. Each shard is about five
  # minutes of checks (timed on main's #147 deploy: the show night 3:17, the
  # smoke 1:34, the black box 1:42, tools 1:36, the drop map 2:27 of which a
  # minute was printed-only cases, now left to MIRROR_ALL=1), and within a
  # shard every check runs whatever failed before it. The repository is
  # public, so the extra runners cost nothing. A fourth, `open`, is the
  # startup check alone: it opens the show twice on a cold shader cache and
  # then every look on its own, about five minutes, which the tools shard
  # (eight already) had no room for under the timeout.
  webgpu:
    name: WebGPU (macOS) · ${{ matrix.shard }}
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [show, tools, plate, open]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      # Once, first: the scripts run with plain `node` read the built app.
      - name: Build
        id: build
        run: npm run build
      # Every shader compiles, before anything builds a pipeline from one.
      - name: The shaders compile
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'show' }}
        run: npm run wgsl
      # The solver's physics on its own: the projection is incompressible
      # (multigrid against the sweeps), and the magnet draws ferrofluid in
      # without making, losing or over-packing any.
      - name: The physics
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run physics
      # Particles are drawn where their dye is, not at its mirror.
      - name: The particles
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run particles
      # The plate's relief (slopes, edges) is worked out where the dye is, not at its mirror.
      - name: The relief
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run derive
      # Held still, the Blow grows a bubble with a fingered rim and a ring of satellites.
      - name: The straw bubble
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run straw
      # A press goes down round and lifts into fingers, and a plain spring lift does not.
      - name: The press and its lift
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run lift
      # A press moves the oil out from under the palm with its colour, onto the
      # ring the dye lands on, and keeps all of it (PLAN §15d).
      - name: The press moves the oil
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run pressoil
      # Thin Gap (PLAN §18a): a push fades at the drag time 12ν/h², a press
      # pushes out the volume it displaces and takes it back when the glass
      # lifts, a tight gap carries what Darcy says, and liquid is conserved
      # where the gap changes; each against the old solver.
      - name: The thin gap
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run thingap
      # The app's own Press on a thin gap: the ring goes out as far as the
      # displaced volume says with every drop kept, the colour's carry takes
      # the substeps it needs, and it comes back when the glass lifts.
      - name: The Press comes back on a thin gap
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run presslift
      # And the GPU half of the same seed: seeded dye and bubbles through the
      # solver and the plate shader twice, the same bytes; another seed, not.
      # Then the built app: ?seed= reaches it, and it says which seed it is on.
      - name: The seed on the GPU, and in the app
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run seed -- --lab --app
      # The closeup pushes in like a microscope: the cells come through as they resolve.
      - name: The microscope
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run microscope
      # An oil drop as a projector throws it (upright, dark past its aperture's core) and as the
      # closeup's camera sees it (small ones turn the plate over, big ones flat); no highlight.
      - name: The drop lens
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run droplens
      # An air bubble as a projector throws it: a small one a dark disc round a pin-point, a big
      # one a clear window edged in a band from half the gap; the closeup keeps the camera's bubble.
      - name: The air lens
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run airlens
      # Film Physics on the plate: nothing but the film changes; the projector's bubbles take the
      # faint tint the light through a film is, the closeup's the soap's own reflected gold.
      - name: The film, photographed
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run filmlook
      # The ferrofluid is drawn with an edge: a line at any zoom, black all
      # through, a thin film still visible, the glint fixed as the plate turns.
      - name: The ferrofluid's edge
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run ferrolook
      # Maze Detail grows finer ferrofluid fingers than the default maze gets
      # in twice the time, keeps all of it, and the grid floor holds.
      - name: The ferrofluid maze's detail
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run maze
      # The magnet held close stands the ferrofluid up: the pool parts into
      # lit domes and its outline stops being a blob's; a look's own far
      # magnet leaves it whole; a second finger raises domes of its own.
      - name: The ferrofluid's spikes
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run spikes
      # Past the spikes, the held magnet pulls a big pool's edge out in black
      # fingers, on Classic and on Magnet Garden; with no magnet or the look's
      # own far one the edge stays put.
      - name: The ferrofluid's fingers
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run fingers
      # The Finger and Blow carry the ferrofluid, as they carry the dye; the
      # tools' push alone (all they did before) leaves it where it was.
      - name: The hands move the ferrofluid
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run ferrohands
      # Pushes Dye: where the ferrofluid grows the colour leaves and packs
      # along its edge, conserved, and at 0 nothing changes.
      - name: The ferrofluid pushes the dye
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run ferrodye
      # Oil Bodies: amber oil on teal water stays two colours while the drops
      # round, merge and turn; poured dye lands in the liquid under it, a
      # hand drags the oil, nothing is made or lost, and at 0 nothing runs.
      # Twelve seconds on Metal (#179's run, 17/17), where software WebGPU
      # takes some twenty minutes; the plate shard ran 8:45 with it in, well
      # inside its fifteen.
      - name: Oil and water as bodies
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run bodies
      # No grating over the dye: the grid's one-cell checkerboard goes in a
      # second, in every look, and edges, blobs and fine diagonals stay.
      - name: No grating over the dye
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run grating
      # The mixer: each source moved lands only where that source is (the
      # film under the back plate, the logo under the film), the LED ring
      # passes the front plate from lamp to beam, every grade does what its
      # name says, and every one of the 31 controls changes the picture; the
      # gel wheel and the lumia in the lamp, over the lens and among the rest.
      - name: The mixer's order and grades
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run mixer
      # Ferro Paint pours its ferrofluid over the whole plate, so after it has
      # played the black is worked through nearly every part of the colour;
      # every other look pours exactly what it did.
      - name: The ferrofluid through the whole plate
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run ferropour
      - name: The WebGPU smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'show' }}
        run: npm run webgpu
      # And the show night itself, on the WebGPU stage. It runs here rather
      # than beside the other one because it needs a GPU: a Linux runner's
      # software WebGPU can compute but cannot present a canvas (the P0
      # spike). These runners have Metal, so it also runs at the real device
      # pixel ratio and on the GPU solver, which the ubuntu job cannot.
      # A show night on what a visitor actually gets, at the real device pixel
      # ratio and on the GPU solver — neither of which the ubuntu job can do.
      - name: A show night
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'show' }}
        run: QA_DPR=1 QA_GPU=mid npm run qa
      # Beat Squeeze presses the lead plate on a kick and lets it go again,
      # and at 0 presses nothing: counted in the app with the band playing,
      # on Fillmore East. Until #185 found it, a kick's press landed a
      # fraction of a cell off the grid and laid nothing, and no check
      # counted.
      - name: The rhythm plate presses on the kick
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'show' }}
        run: SQUEEZE_GPU=1 node scripts/squeeze.mjs
      # Render this song in the app itself (PLAN.md §6): a synthetic song
      # rendered ten ways through the visualizer's own frame loop, frame by
      # frame on the film's clock. The same seed draws the same frames hash
      # for hash; another seed, a silent song and Evolve each draw others;
      # a GPU taken away mid-render fails that render and says why; and after
      # every run the app is given back as it was. It runs here and not on
      # ubuntu because it needs the app's frames read back, which software
      # WebGPU does not do. The build above is the one it serves, so this
      # calls the script and not `npm run render-app` (which builds first).
      - name: A song rendered in the app
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'show' }}
        run: node scripts/render-app.mjs
      # The post chain in the app: the chain with nothing in it draws the
      # plate's own picture, the ring keeps what it was given, and the
      # effects' randomness is the same twice.
      - name: The post chain
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run fx
      # The show opens without stopping (scripts/startup.mjs): what the look
      # opens with is built before it opens and the rest behind it, none is
      # built on a frame, no two frames are more than two seconds apart but
      # for the time Chromium holds the page's whole thread while it starts
      # its GPU (no frame, timer or long task of the page's, not begun where
      # a promise it awaits settled, in the first three seconds; held to
      # 4.5 s), and the plate
      # moves for good no later than it did the old way. On a shard
      # of its own, because it empties the Mac's shader cache, and one after
      # another check would find it warm; depth, first on the tools shard,
      # is how the nine-second freeze was found and still sees it cold.
      - name: The show opens without stopping
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'open' }}
        run: npm run startup
      # The show keeps hearing while its window is hidden behind the wall's
      # (scripts/ears.mjs, PLAN.md §14a): its own frames withheld, a second
      # window asking for frames as the projector window does, and the level
      # the plate reads has to keep moving. After startup, on the shard that
      # finishes first, because it only needs a plate that draws, not a cold one.
      # Run directly, as render-app is, on the build step's own output.
      - name: The ear behind the wall
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'open' }}
        run: node --experimental-strip-types scripts/ears.mjs
      # The plate hears a new reading nearly every frame while the App renders
      # ten times a second (scripts/renders.mjs, PLAN.md §14f): the line the
      # Measure job skips, because there no plate draws. About forty seconds.
      - name: The sound's renders, with a plate
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'open' }}
        run: node scripts/renders.mjs
      # The plate's own depth, which until F reached nothing (bubbles-plan.md
      # F): a domed plate's tight rim has to run slower than its deep centre,
      # a flat plate has to be untouched however high the dial goes, and a
      # press has to keep its dent while the glasses change shape under it.
      # The margins are wide — the rim/centre ratio moves 1.13 to 0.08 where
      # the gate asks for 10% — because what it guards is a sign and a place,
      # not a tuning.
      - name: Depth reaches the flow
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'tools' }}
        run: npm run depth
      # The Magnet in the hand (reported: "magnet tool isn't really
      # working"): picked on a look with no ferrofluid it pours some, and
      # dragged across the plate the ferrofluid goes with it, against the
      # same plate left alone.
      - name: The magnet moves the ferrofluid
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: npm run magnet
      # Every other tool in the hand (asked for: "check all of the tools to
      # make sure they work in expected ways"): each does what it says and
      # nothing else, and hovering does nothing (scripts/tools.mjs).
      - name: Every tool does what it says
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'tools' }}
        run: node scripts/tools.mjs
      # And the liquid in the bottle, from every tool that lays one: Pour,
      # Spray, Splat and Streak laid only its colour, so a Ferrofluid Pour
      # was black dye the Magnet could not move (scripts/bottles.mjs).
      - name: Every tool lays the bottle
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'tools' }}
        run: node scripts/bottles.mjs
      # And on a phone, several at once: two fingers are two hands, each
      # where it is, lifting one leaves the other, two fingers holding Drop
      # lay dye under both, and on the closeup two fingers pinch the zoom.
      - name: The phone's fingers
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'tools' }}
        run: PHONE_GPU=1 node --experimental-strip-types scripts/phone.mjs

      # A drop lands where it is dropped: on the Design desk, on either layer,
      # the cell under the hand changes and its mirror image across the middle
      # does not (reported: an echo of the gesture "in the mirrored section").
      - name: A drop lands only where it is dropped
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: node scripts/mirror.mjs

      # And the physics under it: the ferrofluid gathers where the magnet is
      # (not at its mirror), held close pulls harder than held away, and the
      # magnet neither makes nor loses liquid.
      - name: The ferrofluid's physics
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: node scripts/ferro.mjs
      # Performances start and stop by hand (reported: "the performance auto
      # detect doesn't work well"): T starts one, nothing painted keeps
      # nothing, and what is painted is kept, on its own clock with no song.
      - name: A performance starts and stops by hand
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'plate' }}
        run: node scripts/take.mjs
      # The black box records (crash-plan.md): errors land with a snapshot,
      # a device loss and its recovery are logged, frames that stop become a
      # fatal and light the button, a report from a destroyed device still
      # returns with no screenshot, and the log survives the reload.
      - name: The black box
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'tools' }}
        run: node scripts/crash.mjs
      # And the projector's geometry, on a GPU: which pixels are black, and
      # how many times a second the whole screen is allowed to change.
      - name: The wall
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'tools' }}
        run: npm run wall
      # ffmpeg is not on the macOS image; imageio-ffmpeg is a static build that
      # scripts/watch.mjs finds by itself. Homebrew's Python refuses a plain
      # pip install (PEP 668), hence the second try.
      - name: ffmpeg, to watch a take
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'tools' }}
        run: command -v ffmpeg || python3 -m pip install --quiet --user imageio-ffmpeg || python3 -m pip install --quiet --break-system-packages imageio-ffmpeg
      - name: The show keeps moving
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'tools' }}
        run: node scripts/moving.mjs

  # The one name the rest of the repository knows this stage by: green only
  # when every shard is.
  webgpu-all:
    name: WebGPU (macOS)
    needs: webgpu
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.webgpu.result }}" = success
