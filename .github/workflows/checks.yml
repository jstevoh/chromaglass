name: Checks

# What has to be true before a build is allowed to reach the live site.
#
# This used to be `tsc --noEmit` and `vite build`, which between them prove
# that the code is well-typed and that the bundler is happy — and nothing at
# all about whether the app works. The six numeric harnesses and the browser
# walkthrough existed the whole time and were never run by anything except a
# person remembering to. Since `npm run show` pulls `main` on show night, what
# that added up to was: an untested `main` is what arrives at the venue.
#
# Two jobs, because they cost very different amounts of time and a fast red X
# is worth more than a slow one:
#
#   measure   the pure-logic harnesses. A couple of minutes, no browser.
#   drive     the ones that put a real browser in front of the real build.
#             These run on software rasterisation at a few frames a second,
#             so they are slow by nature rather than by accident.
#
# Called by `deploy.yml` before it publishes, and run directly on every pull
# request.

on:
  workflow_call:
  pull_request:

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # 22, not 20: `music`, `scene`, `liquids` and `wall` all run their
      # TypeScript sources directly through `node --experimental-strip-types`,
      # which arrived in 22.6. On 20 every one of them fails to start, which
      # with `deploy.yml`'s `needs: checks` would have blocked every deploy.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run lint

      # Every preset's dish: that its dyes, injection styles and liquids all
      # name things that exist. The cheapest check in the repo and the one that
      # catches a rename that a type cannot.
      - name: The plate
        run: npm run plate

      # That a look change never cuts the plate to black in front of a room.
      - name: The desk
        run: npm run desk

      # The two lists that have to agree about what a control is: the settings
      # panel's own markup, and the registry the desks pin from.
      - name: The panel
        run: npm run panel

      # The ear: level traces through the real calibration into the boundary
      # detector, synthetic songs through the real matcher, and the tempo
      # sources through the real beat clock.
      - name: The ear
        run: npm run music

      # Soap, milk, silicone and glycerine, each measured on the thing it is
      # for — and first, that an empty plate is left completely alone.
      - name: The liquids
        run: npm run liquids

      # The room sensor: painted rooms through the real analysis, a closed
      # feedback loop, and a person who walks in and stops.
      - name: The room
        run: npm run scene

  drive:
    name: Drive
    runs-on: ubuntu-latest
    # Generous on purpose. A GitHub runner has no GPU, so everything here runs
    # through SwiftShader at a handful of frames a second; the harnesses wait
    # on the renderer rather than on a timer for exactly that reason.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `scripts/chromium.mjs` prefers PW_CHROMIUM, then the sandbox's fixed
      # path, then whatever Playwright downloaded — which is this.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The projector's geometry and the flash guard: which pixels are black,
      # and how many times a second the whole screen is allowed to change.
      - name: The wall
        run: npm run wall

      # The app itself: it builds, it serves, and a browser is walked through a
      # show night with the console watched the whole way.
      - name: A show night
        run: npm run qa
