name: Checks

# What has to be true before a build is allowed to reach the live site.
#
# This used to be `tsc --noEmit` and `vite build`, which between them prove
# that the code is well-typed and that the bundler is happy — and nothing at
# all about whether the app works. The six numeric harnesses and the browser
# walkthrough existed the whole time and were never run by anything except a
# person remembering to. Since `npm run show` pulls `main` on show night, what
# that added up to was: an untested `main` is what arrives at the venue.
#
# Three jobs, because they cost very different amounts of time and a fast red X
# is worth more than a slow one:
#
#   measure   the pure-logic harnesses. Half a minute, no browser.
#   webgpu    everything with a picture in it, on a runner with a GPU: the
#             stage, a show night, the post chain and the wall.
#
# There is one engine since P7, and a runner without a GPU can compute WebGPU
# but cannot present its canvas (the P0 spike) — so every check that needs a
# picture runs on macOS, and ubuntu keeps the ones that need only arithmetic.

on:
  workflow_call:
  pull_request:

# A second push to a branch makes the first push's run pointless, and these are
# expensive: three runners, one of them for most of an hour. Superseded pull
# request runs are cancelled. Deploys are not — `deploy.yml` has its own
# `cancel-in-progress: false` on the live channel, and a `workflow_call` run
# inherits the caller's group rather than this one.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # 22, not 20: `music`, `scene`, `liquids` and `wall` all run their
      # TypeScript sources directly through `node --experimental-strip-types`,
      # which arrived in 22.6. On 20 every one of them fails to start, which
      # with `deploy.yml`'s `needs: checks` would have blocked every deploy.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run lint

      # Every preset's dish: that its dyes, injection styles and liquids all
      # name things that exist. The cheapest check in the repo and the one that
      # catches a rename that a type cannot.
      - name: The plate
        run: npm run plate

      # That a look change never cuts the plate to black in front of a room.
      - name: The desk
        run: npm run desk

      # The two lists that have to agree about what a control is: the settings
      # panel's own markup, and the registry the desks pin from.
      - name: The panel
        run: npm run panel

      # The ear: level traces through the real calibration into the boundary
      # detector, synthetic songs through the real matcher, and the tempo
      # sources through the real beat clock.
      - name: The ear
        run: npm run music

      # The shape of the quality ladder: that every rung is a rung, that a
      # step down gives something up, and that a rung asking for fewer device
      # pixels actually gets fewer. That last one was inert for a long while
      # and nothing looked.
      - name: The ladder's shape
        run: npm run rungs

      # Soap, milk, silicone and glycerine, each measured on the thing it is
      # for — and first, that an empty plate is left completely alone.
      - name: The liquids
        run: npm run liquids

      # A liquid someone made: the file reads back as what they meant, a bad
      # one says why, and "how it meets the others" agrees with the shelf.
      - name: The liquids file
        run: npm run liquidfile

      # The room sensor: painted rooms through the real analysis, a closed
      # feedback loop, and a person who walks in and stops.
      - name: The room
        run: npm run scene

      # Four harnesses that were written as gates and then never gated
      # anything, because nothing here ran them. All four cover arithmetic
      # with no picture in it, which is the kind most able to be quietly
      # wrong: a triangle that is really a sawtooth, a timecode reader two
      # frames behind all night, a fixture lit on the wrong channel, a shape
      # mapped onto the wrong part of a wall.
      - name: The shapes
        run: npm run shapes

      - name: The timecode
        run: npm run timecode

      - name: The lights
        run: npm run lights

      - name: The mapping
        run: npm run map

      # The crash-report Worker, against in-memory R2 and KV (crash-plan.md):
      # a report is stored with its picture beside it and indexed by the line
      # it died on; the wrong kind, bad JSON and an oversized body are refused
      # without quoting them; the digest folds lines that differ only in their
      # numbers into one group and is closed without the token; and one
      # address is held to its hourly limit. The endpoint is public, so most
      # of what it proves is what it will not do.
      - name: The report Worker
        run: npm run report-worker

  # The WebGPU stage (docs/webgpu-plan.md), on macOS: GitHub's Apple Silicon
  # runners give Chromium a Metal GPU, where a Linux runner's software WebGPU
  # cannot present a canvas (measured in the P0 spike, spike/webgpu-p0).
  webgpu:
    name: WebGPU (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      # Every shader compiles, before anything builds a pipeline from one.
      - name: The shaders compile
        run: npm run wgsl
      # The solver's physics on its own: the projection is incompressible
      # (multigrid against the sweeps), and the magnet draws ferrofluid in
      # without making, losing or over-packing any.
      - name: The physics
        run: npm run physics
      # Particles are drawn where their dye is, not at its mirror.
      - name: The particles
        run: npm run particles
      # The plate's relief (slopes, edges) is worked out where the dye is, not at its mirror.
      - name: The relief
        run: npm run derive
      # Held still, the Blow grows a bubble with a fingered rim and a ring of satellites.
      - name: The straw bubble
        run: npm run straw
      - run: npm run webgpu
      # And the show night itself, on the WebGPU stage. It runs here rather
      # than beside the other one because it needs a GPU: a Linux runner's
      # software WebGPU can compute but cannot present a canvas (the P0
      # spike). These runners have Metal, so it also runs at the real device
      # pixel ratio and on the GPU solver, which the ubuntu job cannot.
      # A show night on what a visitor actually gets, at the real device pixel
      # ratio and on the GPU solver — neither of which the ubuntu job can do.
      - name: A show night
        run: QA_DPR=1 QA_GPU=mid npm run qa
      # The post chain in the app: the chain with nothing in it draws the
      # plate's own picture, the ring keeps what it was given, and the
      # effects' randomness is the same twice.
      - name: The post chain
        run: npm run fx
      # The plate's own depth, which until F reached nothing (bubbles-plan.md
      # F): a domed plate's tight rim has to run slower than its deep centre,
      # a flat plate has to be untouched however high the dial goes, and a
      # press has to keep its dent while the glasses change shape under it.
      # The margins are wide — the rim/centre ratio moves 1.13 to 0.08 where
      # the gate asks for 10% — because what it guards is a sign and a place,
      # not a tuning.
      - name: Depth reaches the flow
        run: npm run depth
      # The Magnet in the hand (reported: "magnet tool isn't really
      # working"): picked on a look with no ferrofluid it pours some, and
      # dragged across the plate the ferrofluid goes with it, against the
      # same plate left alone.
      - name: The magnet moves the ferrofluid
        run: npm run magnet
      # Every other tool in the hand (asked for: "check all of the tools to
      # make sure they work in expected ways"): each does what it says and
      # nothing else, and hovering does nothing (scripts/tools.mjs).
      - name: Every tool does what it says
        run: node scripts/tools.mjs

      # A drop lands where it is dropped: on the Design desk, on either layer,
      # the cell under the hand changes and its mirror image across the middle
      # does not (reported: an echo of the gesture "in the mirrored section").
      # It runs even when an earlier step failed, so the map it prints is
      # there to read whatever else is red.
      - name: A drop lands only where it is dropped
        if: success() || failure()
        run: node scripts/mirror.mjs

      # And the physics under it: the ferrofluid gathers where the magnet is
      # (not at its mirror), held close pulls harder than held away, and the
      # magnet neither makes nor loses liquid.
      - name: The ferrofluid's physics
        run: node scripts/ferro.mjs
      # Performances start and stop by hand (reported: "the performance auto
      # detect doesn't work well"): T starts one, nothing painted keeps
      # nothing, and what is painted is kept, on its own clock with no song.
      - name: A performance starts and stops by hand
        run: node scripts/take.mjs
      # The black box records (crash-plan.md): errors land with a snapshot,
      # a device loss and its recovery are logged, frames that stop become a
      # fatal and light the button, a report from a destroyed device still
      # returns with no screenshot, and the log survives the reload.
      - name: The black box
        run: node scripts/crash.mjs
      # And the projector's geometry, on a GPU: which pixels are black, and
      # how many times a second the whole screen is allowed to change.
      - name: The wall
        run: npm run wall
