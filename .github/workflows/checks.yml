name: Checks

# What has to be true before a build is allowed to reach the live site.
#
# This used to be `tsc --noEmit` and `vite build`, which between them prove
# that the code is well-typed and that the bundler is happy — and nothing at
# all about whether the app works. The six numeric harnesses and the browser
# walkthrough existed the whole time and were never run by anything except a
# person remembering to. Since `npm run show` pulls `main` on show night, what
# that added up to was: an untested `main` is what arrives at the venue.
#
# Kinds of job, because they cost very different amounts of time and a fast
# red X is worth more than a slow one:
#
#   reach     which files the PR changed, and whether any of them can reach
#             a Mac shard (a few seconds).
#   measure   the harnesses that need no GPU, in five parts side by side,
#             ten to twenty minutes each, on ubuntu.
#   webgpu    everything with a picture in it, on a runner with a GPU: the
#             stage, a show night, the post chain and the wall.
#
# There is one engine since P7, and a runner without a GPU can compute WebGPU
# but cannot present its canvas (the P0 spike) — so every check that needs a
# picture runs on macOS, and ubuntu keeps the ones that need only arithmetic.

# The run's title carries the commit it tested, which for a pull request is
# GitHub's merge of the head into its base, not the head. The deploy reads it
# back (`scripts/deploygate.sh`) to ask whether main's new tree is the tree
# this run passed on, directly, rather than inferring it from the head. Ignored
# when `deploy.yml` calls this workflow, which keeps its own title.
run-name: "${{ github.event.pull_request.title || 'Checks' }} (tests ${{ github.sha }})"

on:
  workflow_call:
    inputs:
      # The deploy turns the Mac off when its gate found the PR's site files
      # apart from main's newer changes (deploygate.sh rule 5); anything else
      # that calls this workflow gets the Mac.
      mac:
        type: boolean
        default: true
      # The Mac shards to run on the owner's own Mac rather than GitHub's, as a
      # JSON list of shard names (PLAN.md 19ah). Only `deploy.yml` passes one,
      # from its `mac` probe, on a push to main or a run by hand on main. A
      # pull request never has inputs: its own `mac` job below asks instead.
      local:
        type: string
        default: '[]'
  pull_request:

# A second push to a branch makes the first push's run pointless, and these are
# expensive: three runners, one of them for most of an hour. Superseded pull
# request runs are cancelled. Deploys are not — `deploy.yml` has its own
# `cancel-in-progress: false` on the live channel, and a `workflow_call` run
# inherits the caller's group rather than this one.
#
# Except a re-run. A re-run joins the group again, and with cancel-in-progress
# it cancelled whatever was running there, which is the PR's newest push: on
# 4 October, re-running ea7eb00's red run (attempt 3, 19:28 UTC) cancelled
# ec0f102's run on the same PR, and re-running ed7126a's (16:54 UTC)
# cancelled e0b7c9e's, so the owner's click on the old red run threw away the
# run the merge and the deploy gate would have read. A re-run (any attempt
# after the first) now waits behind a run in progress instead of cancelling
# it. A newer push still cancels the re-run, as it cancels any older run.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

# Read-only, written out rather than left to the repository's default, which a
# settings change could widen (the security audit of 2026-10-28).
permissions:
  contents: read
  # reach.mjs reads this PR's earlier runs, checkguard.mjs the PR's commits and body.
  actions: read
  pull-requests: read

jobs:
  # What the pull request's diff can reach (scripts/reach.mjs, PLAN.md 19h). A
  # push of only PLAN.md, the docs, the sessions' skills, a workflow that
  # never runs a Mac shard or the scripts that check the workflows does not
  # queue the Mac shards: it proves
  # nothing new there, and on 2026-10-03 each such push still waited twenty
  # to thirty minutes for a Mac and then held one for forty-five runner-minutes
  # in front of PRs that did change the plate. Measure runs, in full unless the
  # diff is only check scripts and documents (19k-4, below). A deploy
  # (`workflow_call`) reaches the Mac unless its gate passed `mac: false`
  # (deploygate.sh rule 5), and the gate never trusts a run that skipped it.
  reach:
    name: What the change reaches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.reach.outputs.mac }}
      shards: ${{ steps.reach.outputs.shards }}
      parts: ${{ steps.reach.outputs.parts }}
      only: ${{ steps.reach.outputs.only }}
    steps:
      # Two deep: the pull request's merge commit and the base it was merged
      # into, which is the whole of what the PR changes.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # Since PLAN.md 19i a diff that does reach a Mac shard is asked once
      # more: if it differs from this PR's last run that passed the Mac only in
      # files the PR does not touch (main's, merged in) or files no Mac shard
      # reads, that run's result is carried and the shards are skipped. The
      # job leaves a "carried" notice naming the run, which the deploy gate
      # follows back to it. The earlier runs are read with this job's token
      # (the repository's default is read for every scope).
      - name: Which files reach a Mac shard
        id: reach
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          CALL_MAC: ${{ inputs.mac }}
        run: node scripts/reach.mjs --diff

  # Measure, in five parts side by side. As one job it took a median 14.3
  # minutes and at most 14.9 over 87 green runs on 2026-10-03 against its
  # 15-minute timeout, so the next slow runner would have turned it red with
  # nothing wrong; and its first red step skipped every step after it, so a
  # push with two things wrong found one (PLAN.md 19b). Split by what each
  # step needs: the arithmetic (`logic`, about four minutes, most of it the
  # drops), the sound harnesses that want ffmpeg (`sound`, about six), the
  # ones that want Chromium (`browser`, about twelve), and the lab on the
  # CPU rasteriser, in two halves (`lab` and `lab2`, about twelve and ten:
  # Chromium, then `holeline` building three labs on one, `lampzero` drawing
  # every look in two labs on the other). Every check runs whatever failed
  # before it in its part. GitHub's ubuntu runners are not the queue the Mac's
  # are, so five at once cost the queue nothing.
  #
  # Since PLAN.md 19k-4 a pull request whose diff is only check scripts, the
  # manifest's entries, the npm scripts checks run and documents runs only the
  # Measure checks it reaches, and only the parts that have any: `reach` says
  # which (`parts`, and `only`, the names). Anything else, and every deploy and
  # run by hand, runs every part in full. Four to twelve minutes off the wall
  # time to green, none off any queue.
  measure-part:
    name: Measure · ${{ matrix.part }}
    needs: reach
    runs-on: ubuntu-latest
    # The browser part ran 11:47 on main before the switches step (two to three
    # minutes in CI); 15 left it no headroom. 25 since PLAN 33b: the lab part ran
    # 13.8 minutes on a recent PR and `holeline` now builds a third lab (the
    # control with the air mask taken out), so 20 left the same thin margin.
    # The lab part then ran 22:10 of the 25 on 2026-10-27 (holeline 9.3, the
    # lamp's two labs 2.6, bubblelook 3.0, sign-in 3.0, the slosh dish 2.0, the
    # rest 2.2); the lab part of main's deploys ran 24:52 and 23:29, and a PR's
    # full run was cancelled at the limit. The bound stays; the part is split in
    # two, so the slowest of the five is the browser's, 19:14.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.reach.outputs.parts) }}
    steps:
      - uses: actions/checkout@v5
      # 22, not 20: `music`, `scene`, `liquids` and `wall` all run their
      # TypeScript sources directly through `node --experimental-strip-types`,
      # which arrived in 22.6. On 20 every one of them fails to start, which
      # with `deploy.yml`'s `needs: checks` would have blocked every deploy.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        id: install
        run: npm ci

      # The bands: synthetic kicks, snares, hats, a bass line and a pad through
      # the analyser the show and a song render both use, alone and mixed, loud
      # and 20 dB down, at 60 and 30 fps. Each drum found on its own hits within
      # a frame, nothing firing on another's, and two runs of the same song
      # byte-identical. Then the shelf's real MP3s, decoded with ffmpeg, which
      # the ubuntu runner does not have until it is installed here; with no
      # decoder the script fails on CI rather than skipping the real music.
      # Bounded for the reason in PLAN 19ab: on 2026-10-22 this step hung twice,
      # 1474 s and 1471 s, both ended by the job's 25-minute wall rather than by
      # finishing, against 22 s on the runs either side of the outage. The sound
      # shard's own work is about three minutes, so an unbounded apt buries it on
      # its own and the shard dies before its first sound check runs — every PR in
      # the repo red for an hour, whatever it changed. Four minutes is ten times
      # the warm cost; past that the mirror is not answering and the useful
      # output is this step's name, not a cancelled harness.
      #
      # The bound only made the outage legible; it kept coming (PLAN 19ab-4): on
      # 2026-10-26 the step ran out its four minutes twice in an hour, on #495 and
      # #402, and every ffmpeg check after it failed on "no ffmpeg on the path" and
      # "no ffprobe on the path" for a diff that touched no sound. ffmpeg is a real
      # need, unlike the browser's fonts (19ab-2), so the answer is not to skip it
      # but to stop waiting on the mirror. scripts/debcache.sh installs the .debs
      # the Actions cache kept with apt reading no sources at all (about a second),
      # and only on a miss, or a set that no longer fits the image, fetches them:
      # apt says which, and curl fetches them eight at a time from whichever mirror
      # delivers, dropping one that sends under 300 KB/s, each file held to apt's
      # hash. Not apt's own download: on this PR's first run the Azure mirror gave
      # the lists at 11 MB/s and the 87 packages at 55 KB/s, nineteen minutes'
      # worth, and apt has no speed floor. Ubuntu's own ffmpeg either way, not a
      # static build whose decoder would be a new input to the sound checks. The
      # cache is keyed by the runner image, a new image trying the last one's set
      # first. Then both binaries are required by name, so a failure here says so
      # here and not as four sound checks' FAIL lines.
      - name: Which runner image, for ffmpeg's packages
        id: image
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.part == 'sound' }}
        run: |
          echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: ffmpeg's packages, from the cache
        id: ffdebs
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.part == 'sound' }}
        uses: actions/cache/restore@v4
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}
          restore-keys: ffmpeg-debs-${{ steps.image.outputs.os }}-
      - name: ffmpeg, for the shelf and the render's files
        id: ffmpeg
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.part == 'sound' }}
        timeout-minutes: 4
        run: |
          bash scripts/debcache.sh "$HOME/ffmpeg-debs" ffmpeg
          for b in ffmpeg ffprobe; do
            command -v "$b" > /dev/null || { echo "::error title=ffmpeg::$b is not on the path after the install; every sound check that decodes or opens a file fails on it"; exit 1; }
            "$b" -hide_banner -version | sed -n 1p
          done
      - name: ffmpeg's packages, kept for the next run
        if: ${{ !cancelled() && steps.ffmpeg.outcome == 'success' && steps.ffdebs.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}

      # The browser, for the browser, lab and lab2 parts' checks.
      # The browser is fetched inside the same 25 minutes as the measuring, so a
      # cold download is a red with nothing wrong in the diff (PLAN 19ab). On
      # 2026-10-22 this step took 650 s on the browser shard and 683 s on the lab
      # shard, against 33 s where the browser was already on the runner; the
      # browser shard's own work is about eighteen minutes, so eleven minutes of
      # download puts it at twenty-nine against a limit of twenty-five and the
      # harnesses are cancelled mid-flight. Two PRs went red that way in one
      # afternoon, neither of them touching a browser check.
      #
      # Keyed on the Playwright version alone, not on the lockfile's hash: the
      # browser build a given version installs never changes, so the version is
      # the whole of what the cache depends on, while a lockfile key would throw
      # the browser away on every unrelated dependency bump and pay the eleven
      # minutes again. Read from the installed package rather than parsed out of
      # the lockfile, so it is the version actually in use.
      - name: Which Playwright
        id: pw
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(fromJSON('["browser","lab","lab2"]'), matrix.part) }}
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: The browser, from the cache when it is there
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(fromJSON('["browser","lab","lab2"]'), matrix.part) }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      # The browser only, not `--with-deps`: with the cache warm this is a
      # second, and the six minutes are for the cold download the cache misses
      # once a Playwright version.
      - name: Install Chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(fromJSON('["browser","lab","lab2"]'), matrix.part) }}
        timeout-minutes: 6
        run: npx playwright install chromium
      # The system libraries, from apt only when one is missing (PLAN 19ab-2).
      # `--with-deps` ran apt on every run, and on 2026-10-24 it timed out at six
      # minutes on a mirror sending 50 to 100 KB/s, fetching eight upgrades of
      # libraries the runner already had and nine fonts nothing draws; every
      # browser check after it passed. So the runner is asked what is missing
      # (scripts/chromiumlibs.mjs: ldd over every binary of both builds, then a
      # launch of each) and apt runs only for a real gap. Not `continue-on-error`
      # on the old step: that keeps a slow mirror green but lets a truly missing
      # library surface later as a harness's browser closing at launch, with
      # nothing naming it. Here a gap apt cannot fill fails this step, with the
      # library's name, before the first harness runs. Eight minutes covers apt
      # on the rare run that needs it; the run that does not takes seconds. The
      # retries are for a connection that stalls rather than one that is slow:
      # on 2026-10-22 one held the ffmpeg step for 1474 s without a byte.
      - name: Chromium's system libraries, from apt only if one is missing
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(fromJSON('["browser","lab","lab2"]'), matrix.part) }}
        timeout-minutes: 8
        run: |
          node scripts/chromiumlibs.mjs && exit 0
          echo "::warning title=Chromium's system libraries::the runner is missing one (listed above); installing Playwright's packages from apt"
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
          npx playwright install-deps chromium || { echo "::error title=Chromium's system libraries::a library is missing (listed above) and apt could not install Playwright's packages"; exit 1; }
          node scripts/chromiumlibs.mjs || { echo "::error title=Chromium's system libraries::still missing after apt (listed above); every browser check after this fails on it"; exit 1; }

      # Every check in this part, from scripts/checks.json, in the manifest's
      # order (PLAN.md 19k). Each opens a `Run <command>` group as its own step
      # did, a red one is an error annotation with its name and its FAIL lines,
      # each has its own timeout where the manifest gives one, and every check
      # runs whatever failed before it. The job's summary is a table of every
      # check's time. A new check is an entry in the manifest, never a step
      # here: `npm run checks` holds this file to it.
      - name: The checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          CHECKS_ONLY: ${{ needs.reach.outputs.only }}
        run: node scripts/checks.mjs --ci ${{ matrix.part }}

  # The WebGPU stage (docs/webgpu-plan.md), on macOS: GitHub's Apple Silicon
  # runners give Chromium a Metal GPU, where a Linux runner's software WebGPU
  # cannot present a canvas (measured in the P0 spike, spike/webgpu-p0).
  #
  # Three runners side by side rather than one after another. On one runner
  # the job took sixteen minutes, every check waiting on the one before it,
  # and the first failure skipped everything after it, so a push with three
  # things wrong took three rounds to find them. Each shard is about five
  # minutes of checks (timed on main's #147 deploy: the show night 3:17, the
  # smoke 1:34, the black box 1:42, tools 1:36, the drop map 2:27 of which a
  # minute was printed-only cases, now left to MIRROR_ALL=1), and within a
  # shard every check runs whatever failed before it. The repository is
  # public, so the extra runners cost nothing. A fourth, `open`, is the
  # startup check alone: it opens the show twice on a cold shader cache and
  # then every look on its own, about five minutes, which the tools shard
  # (eight already) had no room for under the timeout.
  #
  # The repository being public makes the runners free, not plentiful: the
  # account runs about five Mac jobs at once, and on 2026-10-03 a shard
  # waited a mean 21 to 31 minutes for one (`npm run macqueue`). So the
  # shards are kept even, the longest about eleven and a half minutes by the
  # medians then (tools 13.2 → about 9.8 without the phone's fingers, open
  # 7.8 → about 11.2 with them, which grew to 18.7 by 2026-10-04 and sent
  # the fingers on to show, PLAN.md 19r; plate 11.2 → about 10.2 without the mixer
  # and 11.3 with #218's Ben-Day print (63 s on its PR's runs), show 8.8 →
  # about 9.8 with the mixer), and they do not run at all for a change
  # that reaches none of them (the `reach` job above). Since PLAN.md 19k a
  # change to check scripts alone runs only the shards their checks are on,
  # and which checks a shard runs is `scripts/checks.json`, not this file.
  #
  # The tools shard also takes the Press's let-go on a thin gap with its two
  # controls (about 35 s more; #228).
  #
  # A fifth shard since 2026-10-11 (PLAN.md 19w). Checks had gathered on all
  # four until, by the medians of 41 green runs from 10-09 to 10-11, plate ran
  # 16.7 minutes (19.8 at most), open 16.4, tools 15.9 and show 15.3: 64
  # minutes of work in four 20-minute jobs, so moving plate's heaviest steps
  # to another shard would only have moved the timeout there. One plate run
  # (#353's) was killed at 20:16 after every check in it had passed. `fifth`
  # takes two to five minutes from each: from plate the drop map, the
  # magnet and the grating (the noisiest step there, 81 s median and up to
  # 143); from open Audio Impact 0 and the colours; from tools depth and the
  # flick; from show the mixer, the kick's press and the Turing pattern.
  # Replayed on the 11 of those runs where each shard ran once, the steps'
  # own times put in their new shards: the longest shard went from 18.4
  # minutes to 15.0 (plate 10.7 median, 13.7 at most; open 13.4, 15.0;
  # tools 13.6, 14.1; show 13.2, 14.2; fifth 12.8, 13.4). A shard's own
  # setup is about half a minute (checkout, Node, npm ci, Chromium, the
  # build), so a run costs that much more Mac time and needs five runners
  # at once rather than four, but holds each for less.
  # Is the owner's Mac free to take this pull request's Mac shards (PLAN.md
  # 19ah-6)? The same probe as the deploy's (`scripts/macrunner.mjs`): a
  # runner labelled `owner-mac`, online and idle, takes the first
  # OWNER_MAC_SHARDS of them, and any other answer (busy, asleep, no token, an
  # API that does not answer) sends every shard to GitHub's Macs as before.
  # Only for a pull request whose branch is in this repository. A fork's is
  # the public's code, which the Mac never runs (its hook refuses it in any
  # case), and a fork's run gets no secrets to ask with.
  #
  # The token is MAC_RUNNER_PROBE, in the `mac-runner` environment, which since
  # 19ah-6 lets the sessions' branches (`claude/*`, `antigravity/*`) in beside
  # main: GitHub matches a pull request's run by its head branch's name. It reads the repository's runners and nothing else, so a branch's own
  # workflow that copied it out could learn whether the Mac is busy. Every
  # other key stays where only main can reach it (scripts/cisecrets.mjs).
  mac:
    name: Is the owner's Mac free
    needs: reach
    if: >-
      ${{ github.event_name == 'pull_request' && needs.reach.outputs.mac == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: mac-runner
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.probe.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
      - id: probe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MAC_RUNNER_PROBE }}
          MAC_SHARDS: ${{ vars.OWNER_MAC_SHARDS }}
        run: node scripts/macrunner.mjs

  # The deploy's watchdog (`scripts/macwatch.mjs`, 19ah-3), for a pull request:
  # a Mac that falls asleep between the probe's "free" and the shards would
  # hold them in the queue for up to a day. Stalled for 15 minutes, it cancels
  # the run and says so; "Re-run all jobs" then asks the probe again, which
  # finds the Mac gone and sends the shards to GitHub's. Only the run's token,
  # which may cancel this run and nothing beyond the repository's Actions.
  watchdog:
    name: Watchdog
    needs: mac
    if: ${{ needs.mac.outputs.shards != '' && needs.mac.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHARDS: ${{ needs.mac.outputs.shards }}
        run: node scripts/macwatch.mjs

  webgpu:
    name: WebGPU (macOS) · ${{ matrix.shard }}
    needs: [reach, mac]
    # Written out with `!cancelled()` because `mac` is skipped for a deploy, a
    # fork's pull request and a change that reaches no Mac shard, and a job
    # whose need was skipped is skipped with it unless its condition says
    # otherwise. `reach` must still have succeeded, as before.
    if: ${{ !cancelled() && needs.reach.result == 'success' && needs.reach.outputs.mac == 'true' }}
    # GitHub's Mac, or the owner's (PLAN.md 19ah) for a shard a probe named:
    # `deploy.yml`'s, passed in as `local`, or for a pull request from a branch
    # of this repository the `mac` job's above (19ah-6). A pull request never
    # reads `local`, and a fork's never runs `mac`, so its shards ask for
    # `macos-15`. This line is not the guard, though: a branch can edit it, or
    # bring its own workflow asking for `owner-mac`. The runner itself refuses
    # any job that is not deploy.yml on main from a push or a run by hand, or
    # checks.yml for a pull request whose branch is in this repository (its
    # job-started hook, scripts/macrunner-hook.sh), and a fork's PR waits for
    # the owner's approval (docs/mac-runner.md). A probe that failed outright
    # leaves `shards` empty, which reads as none.
    # Only `owner-mac` is asked for, not `macOS`, so `npm run macqueue` keeps
    # GitHub's Macs and the owner's apart.
    runs-on: ${{ contains(fromJSON(github.event_name == 'pull_request' && (needs.mac.outputs.shards || '[]') || inputs.local || '[]'), matrix.shard) && fromJSON('["self-hosted","owner-mac"]') || 'macos-15' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The shards `reach` selected: every one, but for a PR whose change that
      # reaches the Mac is only check scripts, the manifest's entries or their
      # npm scripts, which runs the shards those checks are on (PLAN.md 19k).
      # The list is in scripts/checks.json, where the deploy gate reads it too.
      matrix:
        shard: ${{ fromJSON(needs.reach.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      # The owner's Mac is also where sessions run the harnesses by hand, on
      # the same fixed ports (`PORT = 43xx` in scripts/), so a shard started
      # beside one would fail to serve, or read the other's server. It waits
      # for them to close, up to ten minutes, and then fails naming who holds
      # them. GitHub's Macs are fresh and skip this.
      - name: The harness ports are free on the owner's Mac
        if: ${{ runner.environment == 'self-hosted' }}
        timeout-minutes: 11
        run: bash scripts/macports.sh 600
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Mac shards have headroom (19w) and no Metal-side download has gone slow
      # yet, but the fetch is as unbounded here as the two above were, and the Mac
      # queue is the one that costs: bound it so a slow mirror spends six minutes
      # and names itself rather than eating a shard's budget before its checks.
      - name: Install Chromium
        timeout-minutes: 6
        run: npx playwright install chromium
      # Once, first: the scripts run with plain `node` read the built app.
      - name: Build
        id: build
        run: npm run build
      # ffmpeg is not on the macOS image; imageio-ffmpeg is a static build that
      # scripts/watch.mjs finds by itself. Homebrew's Python refuses a plain
      # pip install (PEP 668), hence the second try.
      # Bounded with the other fetches (PLAN 19ab): two pip tries against PyPI on
      # the shard that costs the Mac queue most, and nothing above stops them
      # taking the shard's whole budget.
      - name: ffmpeg, to watch a take
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 'tools' }}
        timeout-minutes: 5
        run: command -v ffmpeg || python3 -m pip install --quiet --user imageio-ffmpeg || python3 -m pip install --quiet --break-system-packages imageio-ffmpeg
      # The shard's checks, from scripts/checks.json, as Measure's are.
      - name: The checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/checks.mjs --ci ${{ matrix.shard }}

  # The one name the rest of the repository knows this stage by.
  # Green when every shard is, or when the change reached no Mac shard and
  # the shards were skipped for that reason alone (a shard skipped because
  # `reach` itself failed is red here).
  webgpu-all:
    name: WebGPU (macOS)
    needs: [reach, webgpu]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: >-
          test "${{ needs.webgpu.result }}" = success ||
          { test "${{ needs.reach.result }}" = success &&
            test "${{ needs.reach.outputs.mac }}" = false &&
            test "${{ needs.webgpu.result }}" = skipped; }

  # A pull request that moves a check's bar or input names it (PLAN.md 19x,
  # scripts/checkguard.mjs). Its own job so that it answers in seconds, and so
  # that after the body gains its "Check changes:" section, re-running the
  # failed jobs re-reads the body (the script asks the API for it, not the
  # event the run started with) without a push or the Mac queue. It reads the
  # merge commit against its first parent, as `reach` does, and passes with
  # nothing to name against on a deploy.
  check-changes:
    name: Check changes named
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Every change to a check's bar or input is named, and an Antigravity PR's Measured lines quote what they printed
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/checkguard.mjs --diff

  # The one name for the five Measure parts and the check-change guard: green
  # only when all of them are. The guard is under this name because the branch
  # rule requires Measure, so a PR cannot merge past an unnamed change.
  measure:
    name: Measure
    needs: [measure-part, check-changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.measure-part.result }}" = success && test "${{ needs.check-changes.result }}" = success
