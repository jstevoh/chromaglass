name: Android TV app

# Builds the Android TV app (PLAN 12-tv-2, androidtv/), runs its unit tests and
# Android's lint, so a change that breaks the TV app goes red on its PR rather
# than on a TV. Lint matters here beyond style: its TV rules (a banner, a
# Leanback launcher, no touchscreen required) and its API-level check are the
# first things the Play review for TV would turn the app away for, and the
# API-level check caught a call that would have crashed every TV older than
# Android 13. The debug APK is kept as the run's artifact, so a TV can be
# side-loaded from any green run (docs/judging.md).
#
# Its own workflow, as ios.yml is: deploy.yml calls checks.yml, and the website
# should not wait on, or be stopped by, the TV app's build. It runs only when
# something the app is made from changes. The page it plays (/tv) and the
# pairing it does are the website's and the show server's, held by `npm run tv`
# and `npm run tvpair` in Measure.
#
# The release (PLAN 12-tv-2b): Actions → Android TV app → Run workflow, on
# main, with "release" ticked, builds the Play bundle signed with the owner's
# upload key (the secrets scripts/android-upload-key.sh sets) and keeps it as
# the run's artifact `chromaglass-tv-release`, to upload in Play Console. Its
# version code is the run number, so each release is larger than the last, as
# Play requires. Only from main: a bundle Play has accepted cannot be taken
# back, so it is built from what was merged, never from a branch.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Build the signed Play bundle (main only)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'androidtv/**'
      - '.github/workflows/androidtv.yml'

concurrency:
  group: androidtv-${{ github.ref }}
  cancel-in-progress: true

# Read-only, written out rather than left to the repository's default, which a
# settings change could widen (the security audit of 2026-10-28).
permissions:
  contents: read

jobs:
  build:
    name: Android TV app (build, unit tests, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: androidtv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image carries the Android SDK (ANDROID_HOME); the
      # platform the app compiles against is fetched if the image lacks it.
      - name: Android platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      # bundleRelease unsigned here: what the release job signs must build on every PR.
      - name: Build, test, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug bundleRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromaglass-tv-debug
          path: |
            androidtv/app/build/outputs/apk/debug/app-debug.apk
            androidtv/app/build/reports/lint-results-debug.html
            androidtv/app/build/reports/tests/
          retention-days: 14

  release:
    name: Android TV app (signed Play bundle)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: androidtv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      # The key goes to the runner's temp folder, outside the checkout, and is
      # removed at the end even when the build fails. Gradle reads its path
      # and password from the environment (app/build.gradle), never a file in
      # the tree.
      - name: Signed bundle
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          ANDROIDTV_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE" ] || [ -z "$ANDROID_UPLOAD_PASSWORD" ]; then
            echo "::error::No upload key: run scripts/android-upload-key.sh on the owner's Mac first (it sets ANDROID_UPLOAD_KEYSTORE and ANDROID_UPLOAD_PASSWORD)."
            exit 1
          fi
          export ANDROID_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.p12"
          trap 'rm -f "$ANDROID_UPLOAD_STORE_FILE"' EXIT
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 -d > "$ANDROID_UPLOAD_STORE_FILE"
          ./gradlew bundleRelease --console=plain
          # Signed by the upload key, or the job is red: an unsigned bundle is refused by Play.
          # -verbose is what makes -certs print each signer's X.509 name; without it
          # jarsigner says only "jar verified." and this grep failed on the first
          # real release (2026-11-13), after the bundle had been signed correctly.
          signed="$(jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab)"
          grep -q 'CN=ChromaGlass Android upload' <<<"$signed"
          echo "Version code $ANDROIDTV_VERSION_CODE (1.0.$ANDROIDTV_VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: chromaglass-tv-release
          path: androidtv/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
